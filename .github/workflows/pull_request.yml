name: Test on Pull Request

# Runs untrusted PR code with a read-only token and no secrets.
# Commenting on the PR is done separately by pull_request_comment.yml.
on:
  pull_request:

permissions:
  contents: read

jobs:
  verify-pull-request:
    env:
      tools: ${{ github.workspace }}/tools
      git: ${{ github.workspace }}/git
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Identify Modified Schematics
        run: |
          echo "Finding modified .sch files..."
          # HEAD is the PR merge commit, HEAD^1 is the base branch
          MODIFIED_SCH_FILES=$(git diff --name-only HEAD^1 HEAD -- 'schematics/**/*.sch')
          MODIFIED_SCH_FILES=$(echo "$MODIFIED_SCH_FILES" | tr '\n' ' ')
          if [ -z "$MODIFIED_SCH_FILES" ]; then
            echo "No new or modified schematics found."
            echo "MODIFIED_SCH_FILES=" >> "$GITHUB_ENV"
          else
            echo "Modified schematics: $MODIFIED_SCH_FILES"
            printf "MODIFIED_SCH_FILES=%s" "$MODIFIED_SCH_FILES" >> "$GITHUB_ENV"
          fi

      - name: Create build dirs
        if: env.MODIFIED_SCH_FILES != ''
        run: |
          mkdir -p ${{ env.tools }}
          mkdir -p ${{ env.git }}

      - name: Install apt packages
        if: env.MODIFIED_SCH_FILES != ''
        run: |
          sudo add-apt-repository ppa:inkscape.dev/stable
          sudo apt-get update
          sudo apt-get install -y tk-dev
          sudo apt-get install -y libxpm-dev
          sudo apt-get install -y inkscape

      - name: Install xschem
        if: env.MODIFIED_SCH_FILES != ''
        run: |
          cd ${{ env.git }}
          git clone --branch 3.4.6 --depth 1 https://github.com/StefanSchippers/xschem.git
          cd xschem
          ./configure --prefix=${{ env.tools }}/xschem
          make -j`nproc`
          make install
          echo "${{ env.tools }}/xschem/bin" >> $GITHUB_PATH

      - name: Install netgen
        if: env.MODIFIED_SCH_FILES != ''
        run: |
          cd ${{ env.git }}
          git clone --depth 1 https://github.com/RTimothyEdwards/netgen.git
          cd netgen
          ./configure --prefix=${{ env.tools }}/netgen
          make -j`nproc`
          make install
          echo "${{ env.tools }}/netgen/bin" >> $GITHUB_PATH

      - name: Generate PDK files
        if: env.MODIFIED_SCH_FILES != ''
        run: |
          cd ${{ env.tools }}
          python3 -m venv ciel-venv
          ciel-venv/bin/python3 -m pip install --upgrade --no-cache-dir ciel
          export PDK_ROOT=${{ env.tools }}/ciel-pdks
          ciel-venv/bin/ciel ls-remote --pdk-family sky130
          # https://github.com/RTimothyEdwards/open_pdks/tree/0fe599b2afb6708d281543108caf8310912f54af
          ciel-venv/bin/ciel enable --pdk-family sky130 0fe599b2afb6708d281543108caf8310912f54af

      - name: LVS
        if: env.MODIFIED_SCH_FILES != ''
        run: |
          export PDK_ROOT=${{ env.tools }}/ciel-pdks
          LVS_FILES=$(echo "$MODIFIED_SCH_FILES" | sed 's|schematics/|lvs/|g' | sed 's|.sch|.report|g')
          make $LVS_FILES

      - name: Generate SVGs
        if: env.MODIFIED_SCH_FILES != ''
        run: |
          export PDK_ROOT=${{ env.tools }}/ciel-pdks
          SVG_FILES=$(echo "$MODIFIED_SCH_FILES" | sed 's|schematics/|svg/|g' | sed 's|.sch|.svg|g')
          make $SVG_FILES

      - name: Upload New SVGs as Artifact
        if: env.MODIFIED_SCH_FILES != ''
        uses: actions/upload-artifact@v4
        with:
          name: svg-previews
          path: svg/
          retention-days: 30

      - name: Save PR number for comment workflow
        if: env.MODIFIED_SCH_FILES != ''
        run: |
          mkdir -p pr
          echo "${{ github.event.pull_request.number }}" > pr/number

      - name: Upload PR number
        if: env.MODIFIED_SCH_FILES != ''
        uses: actions/upload-artifact@v4
        with:
          name: pr-number
          path: pr/
          retention-days: 1
