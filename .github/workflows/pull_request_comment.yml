name: Comment on Pull Request

# Runs in the trusted base-repo context after "Test on Pull Request" finishes.
# Never check out or execute PR code here; treat the downloaded artifact as untrusted input.
on:
  workflow_run:
    workflows: ["Test on Pull Request"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Comment on PR with SVG artifact link
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;

            const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: run.id,
            });
            const prArtifact = artifacts.find(a => a.name === 'pr-number');
            const svgArtifact = artifacts.find(a => a.name === 'svg-previews');
            if (!prArtifact || !svgArtifact) {
              core.info('No modified schematics; nothing to comment.');
              return;
            }

            const { data: zip } = await github.rest.actions.downloadArtifact({
              owner, repo, artifact_id: prArtifact.id, archive_format: 'zip',
            });
            const fs = require('fs');
            const { execSync } = require('child_process');
            fs.writeFileSync('pr.zip', Buffer.from(zip));
            const text = execSync('unzip -p pr.zip number').toString().trim();
            if (!/^[0-9]+$/.test(text)) {
              core.setFailed(`Invalid PR number: ${JSON.stringify(text)}`);
              return;
            }
            const prNumber = Number(text);

            // The PR number came from untrusted code, so confirm it matches this run.
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            if (pr.head.sha !== run.head_sha) {
              core.setFailed(`PR #${prNumber} head ${pr.head.sha} does not match run head ${run.head_sha}`);
              return;
            }

            const runUrl = run.html_url;
            const artifactUrl = `https://github.com/${owner}/${repo}/actions/runs/${run.id}/artifacts/${svgArtifact.id}`;
            await github.rest.issues.createComment({
              owner, repo, issue_number: prNumber,
              body: `### :art: SVGs Generated :art: \n\n SVGs previews were generated by this [this workflow run](${runUrl}) and can be downloaded [here](${artifactUrl}).`,
            });
